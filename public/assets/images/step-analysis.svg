<svg width="280" height="200" viewBox="0 0 280 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark glass tablet -->
  <rect x="30" y="20" width="220" height="140" rx="12" fill="#0d0a08" fill-opacity="0.85" stroke="#C1902E" stroke-opacity="0.4" stroke-width="1.5"/>
  
  <!-- Tablet header dots -->
  <circle cx="48" cy="34" r="3" fill="#E54D2E"/>
  <circle cx="58" cy="34" r="3" fill="#F4D17A"/>
  <circle cx="68" cy="34" r="3" fill="#46A758"/>

  <!-- Candlestick chart elements -->
  <!-- Red candlesticks -->
  <line x1="65" y1="80" x2="65" y2="135" stroke="#E54D2E" stroke-width="1.5"/>
  <rect x="61" y="90" width="8" height="35" fill="#E54D2E" rx="1"/>
  
  <line x1="85" y1="95" x2="85" y2="145" stroke="#E54D2E" stroke-width="1.5"/>
  <rect x="81" y="105" width="8" height="30" fill="#E54D2E" rx="1"/>

  <!-- Green/Gold candlesticks -->
  <line x1="105" y1="65" x2="105" y2="130" stroke="#46A758" stroke-width="1.5"/>
  <rect x="101" y="75" width="8" height="40" fill="#46A758" rx="1"/>

  <line x1="125" y1="50" x2="125" y2="120" stroke="#46A758" stroke-width="1.5"/>
  <rect x="121" y="60" width="8" height="45" fill="#46A758" rx="1"/>

  <line x1="145" y1="40" x2="145" y2="110" stroke="#F4D17A" stroke-width="1.5"/>
  <rect x="141" y="50" width="8" height="50" fill="#F4D17A" rx="1"/>

  <line x1="165" y1="55" x2="165" y2="125" stroke="#E54D2E" stroke-width="1.5"/>
  <rect x="161" y="65" width="8" height="45" fill="#E54D2E" rx="1"/>

  <line x1="185" y1="45" x2="185" y2="115" stroke="#F4D17A" stroke-width="1.5"/>
  <rect x="181" y="55" width="8" height="50" fill="#F4D17A" rx="1"/>

  <line x1="205" y1="35" x2="205" y2="100" stroke="#F4D17A" stroke-width="1.5"/>
  <rect x="201" y="45" width="8" height="40" fill="#F4D17A" rx="1"/>

  <!-- Golden 3D Magnifying Glass on top right -->
  <g filter="url(#glowFilter2)">
    <circle cx="160" cy="85" r="28" fill="#1a140e" fill-opacity="0.3" stroke="#F4D17A" stroke-width="4"/>
    <circle cx="160" cy="85" r="23" stroke="#C1902E" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Glass reflection -->
    <path d="M143 72C148 66 156 63 165 64" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Handle -->
    <line x1="180" y1="105" x2="208" y2="133" stroke="#F4D17A" stroke-width="6" stroke-linecap="round"/>
    <line x1="180" y1="105" x2="208" y2="133" stroke="#0a0807" stroke-width="2" stroke-linecap="round"/>
  </g>

  <defs>
    <filter id="glowFilter2" x="120" y="45" width="105" height="105" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F4D17A" flood-opacity="0.65"/>
    </filter>
  </defs>
</svg>
