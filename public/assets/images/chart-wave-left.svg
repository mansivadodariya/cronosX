<svg width="450" height="350" viewBox="0 0 450 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Candlesticks left -->
  <g opacity="0.35">
    <line x1="30" y1="90" x2="30" y2="240" stroke="#C1902E" stroke-width="1.5"/>
    <rect x="25" y="120" width="10" height="70" fill="#F4D17A" rx="1"/>
    
    <line x1="60" y1="110" x2="60" y2="260" stroke="#C1902E" stroke-width="1.5"/>
    <rect x="55" y="140" width="10" height="80" fill="#C1902E" rx="1"/>
    
    <line x1="90" y1="130" x2="90" y2="280" stroke="#C1902E" stroke-width="1.5"/>
    <rect x="85" y="160" width="10" height="60" fill="#F4D17A" rx="1"/>
    
    <line x1="120" y1="80" x2="120" y2="250" stroke="#C1902E" stroke-width="1.5"/>
    <rect x="115" y="110" width="10" height="90" fill="#F4D17A" rx="1"/>
  </g>
  
  <!-- Wave grid lines -->
  <path d="M-50 260C50 240 100 280 200 250C300 220 350 260 450 230" stroke="url(#goldGradLeft1)" stroke-width="2" opacity="0.7"/>
  <path d="M-50 280C50 260 120 310 220 270C320 230 370 280 450 250" stroke="url(#goldGradLeft2)" stroke-width="1.5" opacity="0.5"/>
  <path d="M-50 300C60 280 140 330 250 290C340 250 390 300 450 270" stroke="url(#goldGradLeft1)" stroke-width="1" opacity="0.3"/>

  <!-- Particles / Nodes -->
  <g opacity="0.6" fill="#F4D17A">
    <circle cx="50" cy="245" r="2.5"/>
    <circle cx="120" cy="275" r="2"/>
    <circle cx="180" cy="255" r="3"/>
    <circle cx="260" cy="235" r="2"/>
    <circle cx="340" cy="250" r="2.5"/>
    <circle cx="410" cy="235" r="2"/>
  </g>

  <defs>
    <linearGradient id="goldGradLeft1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C1902E" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#F4D17A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C1902E" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="goldGradLeft2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C1902E" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#F4D17A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C1902E" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
