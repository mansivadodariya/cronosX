<svg width="600" height="260" viewBox="0 0 600 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Earth curve contour -->
  <path d="M0 240C150 180 450 180 600 240" stroke="#C1902E" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M50 250C200 195 400 195 550 250" stroke="#F4D17A" stroke-opacity="0.2" stroke-width="1"/>

  <!-- World network arcs -->
  <path d="M80 210C180 140 280 150 380 200" stroke="url(#netGrad1)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <path d="M160 190C260 120 380 130 480 190" stroke="url(#netGrad2)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M220 180C300 130 420 140 520 210" stroke="url(#netGrad1)" stroke-width="1.5"/>
  <path d="M50 230C150 160 250 170 320 200" stroke="url(#netGrad2)" stroke-width="1.2"/>

  <!-- Network dots grid -->
  <g fill="#F4D17A" opacity="0.6">
    <circle cx="80" cy="210" r="2.5"/>
    <circle cx="120" cy="195" r="1.5"/>
    <circle cx="160" cy="190" r="3"/>
    <circle cx="200" cy="185" r="2"/>
    <circle cx="220" cy="180" r="2.5"/>
    <circle cx="270" cy="175" r="2"/>
    <circle cx="320" cy="180" r="3.5"/>
    <circle cx="380" cy="185" r="2.5"/>
    <circle cx="420" cy="180" r="2"/>
    <circle cx="480" cy="190" r="3"/>
    <circle cx="520" cy="205" r="2.5"/>
    
    <!-- Secondary cluster dots -->
    <circle cx="140" cy="210" r="1.5"/>
    <circle cx="180" cy="205" r="2"/>
    <circle cx="250" cy="195" r="2.5"/>
    <circle cx="290" cy="190" r="2"/>
    <circle cx="350" cy="195" r="2"/>
    <circle cx="450" cy="200" r="1.5"/>
    <circle cx="500" cy="220" r="2"/>
  </g>

  <!-- Big glowing hub nodes -->
  <g filter="url(#glowHub)">
    <circle cx="160" cy="190" r="4" fill="#ffffff"/>
    <circle cx="320" cy="180" r="5" fill="#ffffff"/>
    <circle cx="480" cy="190" r="4" fill="#ffffff"/>
  </g>

  <defs>
    <linearGradient id="netGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C1902E" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#F4D17A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C1902E" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="netGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4D17A" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#F4D17A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C1902E" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowHub" x="140" y="160" width="360" height="60" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#F4D17A" flood-opacity="0.9"/>
    </filter>
  </defs>
</svg>
