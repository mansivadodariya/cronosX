<svg width="450" height="350" viewBox="0 0 450 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Candlesticks right -->
  <g opacity="0.35">
    <line x1="330" y1="80" x2="330" y2="240" stroke="#C1902E" stroke-width="1.5"/>
    <rect x="325" y="110" width="10" height="80" fill="#F4D17A" rx="1"/>
    
    <line x1="365" y1="100" x2="365" y2="260" stroke="#C1902E" stroke-width="1.5"/>
    <rect x="360" y="130" width="10" height="75" fill="#C1902E" rx="1"/>
    
    <line x1="400" y1="60" x2="400" y2="230" stroke="#C1902E" stroke-width="1.5"/>
    <rect x="395" y="90" width="10" height="90" fill="#F4D17A" rx="1"/>
    
    <line x1="435" y1="40" x2="435" y2="210" stroke="#C1902E" stroke-width="1.5"/>
    <rect x="430" y="70" width="10" height="100" fill="#F4D17A" rx="1"/>
  </g>
  
  <!-- Wave grid lines -->
  <path d="M0 230C100 260 150 220 250 250C350 280 400 240 500 260" stroke="url(#goldGradRight1)" stroke-width="2" opacity="0.7"/>
  <path d="M0 250C80 280 130 230 230 270C330 310 400 260 500 280" stroke="url(#goldGradRight2)" stroke-width="1.5" opacity="0.5"/>
  <path d="M0 270C60 300 110 250 200 290C310 330 390 280 500 300" stroke="url(#goldGradRight1)" stroke-width="1" opacity="0.3"/>

  <!-- Particles / Nodes -->
  <g opacity="0.6" fill="#F4D17A">
    <circle cx="40" cy="235" r="2"/>
    <circle cx="110" cy="250" r="2.5"/>
    <circle cx="190" cy="235" r="2"/>
    <circle cx="270" cy="255" r="3"/>
    <circle cx="330" cy="275" r="2"/>
    <circle cx="400" cy="245" r="2.5"/>
  </g>

  <defs>
    <linearGradient id="goldGradRight1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C1902E" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#F4D17A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C1902E" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="goldGradRight2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C1902E" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#F4D17A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C1902E" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
