<svg width="280" height="200" viewBox="0 0 280 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clipboard on the left/center -->
  <rect x="70" y="25" width="110" height="135" rx="8" fill="#1c1611" stroke="#C1902E" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- Clipboard clip at top -->
  <rect x="105" y="18" width="40" height="14" rx="4" fill="#F4D17A" stroke="#0c0907" stroke-width="1.5"/>
  <circle cx="125" cy="25" r="2.5" fill="#0c0907"/>

  <!-- Checklist lines and checkmarks -->
  <g stroke="#F4D17A" stroke-width="1.8" stroke-linecap="round">
    <!-- Row 1 -->
    <rect x="85" y="48" width="12" height="12" rx="2" fill="none"/>
    <path d="M88 54L91 57L98 50"/>
    <line x1="105" y1="54" x2="160" y2="54" stroke-opacity="0.7"/>

    <!-- Row 2 -->
    <rect x="85" y="70" width="12" height="12" rx="2" fill="none"/>
    <path d="M88 76L91 79L98 72"/>
    <line x1="105" y1="76" x2="155" y2="76" stroke-opacity="0.7"/>

    <!-- Row 3 -->
    <rect x="85" y="92" width="12" height="12" rx="2" fill="none"/>
    <path d="M88 98L91 101L98 94"/>
    <line x1="105" y1="98" x2="150" y2="98" stroke-opacity="0.7"/>

    <!-- Row 4 -->
    <rect x="85" y="114" width="12" height="12" rx="2" fill="none"/>
    <path d="M88 120L91 123L98 116"/>
    <line x1="105" y1="120" x2="158" y2="120" stroke-opacity="0.7"/>
  </g>

  <!-- Golden 3D Target & Arrow on the right -->
  <g filter="url(#glowFilter3)">
    <!-- Target rings -->
    <circle cx="185" cy="88" r="38" fill="#140f0b" stroke="#F4D17A" stroke-width="3"/>
    <circle cx="185" cy="88" r="26" stroke="#C1902E" stroke-width="2.5"/>
    <circle cx="185" cy="88" r="15" fill="#F4D17A" stroke="#F4D17A" stroke-width="2"/>
    <circle cx="185" cy="88" r="6" fill="#0c0907"/>

    <!-- Gold Arrow hitting Bullseye -->
    <path d="M218 55L188 85" stroke="#F4D17A" stroke-width="4" stroke-linecap="round"/>
    <!-- Arrow flights/feathers -->
    <path d="M214 47L224 57M210 51L220 61M218 43L228 53" stroke="#F4D17A" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <defs>
    <filter id="glowFilter3" x="140" y="40" width="100" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F4D17A" flood-opacity="0.7"/>
    </filter>
  </defs>
</svg>
