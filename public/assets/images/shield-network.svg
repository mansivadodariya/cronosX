<svg width="100" height="90" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Constellation lines -->
  <g stroke="#C1902E" stroke-opacity="0.4" stroke-width="1.2">
    <line x1="20" y1="30" x2="35" y2="45"/>
    <line x1="35" y1="45" x2="25" y2="65"/>
    <line x1="80" y1="25" x2="65" y2="45"/>
    <line x1="65" y1="45" x2="75" y2="68"/>
    <line x1="50" y1="10" x2="35" y2="25"/>
    <line x1="50" y1="10" x2="65" y2="25"/>
    <line x1="30" y1="75" x2="50" y2="85"/>
    <line x1="70" y1="75" x2="50" y2="85"/>
  </g>

  <!-- Constellation dots -->
  <g fill="#F4D17A">
    <circle cx="20" cy="30" r="2.5"/>
    <circle cx="35" cy="45" r="2"/>
    <circle cx="25" cy="65" r="2"/>
    <circle cx="80" cy="25" r="2.5"/>
    <circle cx="65" cy="45" r="2"/>
    <circle cx="75" cy="68" r="2"/>
    <circle cx="50" cy="10" r="2.5"/>
    <circle cx="50" cy="85" r="2.5"/>
  </g>

  <!-- Golden Glowing Shield with Check -->
  <g filter="url(#shieldGlow)">
    <path d="M50 20L34 26V45C34 56 41 65 50 68C59 65 66 56 66 45V26L50 20Z" fill="#140f0a" stroke="#F4D17A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M43 44L48 49L58 39" stroke="#F4D17A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <defs>
    <filter id="shieldGlow" x="25" y="12" width="50" height="65" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#F4D17A" flood-opacity="0.6"/>
    </filter>
  </defs>
</svg>
