<svg width="280" height="200" viewBox="0 0 280 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark glass tablet -->
  <rect x="30" y="20" width="220" height="140" rx="12" fill="#0d0a08" fill-opacity="0.85" stroke="#C1902E" stroke-opacity="0.4" stroke-width="1.5"/>
  
  <!-- Tablet header dots -->
  <circle cx="48" cy="34" r="3" fill="#C1902E" fill-opacity="0.6"/>
  <circle cx="58" cy="34" r="3" fill="#C1902E" fill-opacity="0.4"/>
  <circle cx="68" cy="34" r="3" fill="#C1902E" fill-opacity="0.4"/>
  
  <!-- Grid lines -->
  <line x1="45" y1="55" x2="235" y2="55" stroke="#C1902E" stroke-opacity="0.15" stroke-dasharray="3 3"/>
  <line x1="45" y1="90" x2="235" y2="90" stroke="#C1902E" stroke-opacity="0.15" stroke-dasharray="3 3"/>
  <line x1="45" y1="125" x2="235" y2="125" stroke="#C1902E" stroke-opacity="0.15" stroke-dasharray="3 3"/>
  <line x1="85" y1="45" x2="85" y2="145" stroke="#C1902E" stroke-opacity="0.15" stroke-dasharray="3 3"/>
  <line x1="140" y1="45" x2="140" y2="145" stroke="#C1902E" stroke-opacity="0.15" stroke-dasharray="3 3"/>
  <line x1="195" y1="45" x2="195" y2="145" stroke="#C1902E" stroke-opacity="0.15" stroke-dasharray="3 3"/>

  <!-- Candlesticks in background -->
  <g opacity="0.35">
    <rect x="55" y="95" width="5" height="30" fill="#F4D17A" rx="1"/>
    <rect x="75" y="75" width="5" height="40" fill="#C1902E" rx="1"/>
    <rect x="195" y="80" width="5" height="45" fill="#F4D17A" rx="1"/>
    <rect x="215" y="65" width="5" height="55" fill="#F4D17A" rx="1"/>
  </g>

  <!-- Big Glowing Golden Cloud Upload Icon in Center -->
  <g filter="url(#glowFilter1)">
    <!-- Cloud shape -->
    <path d="M140 65C127.5 65 117.2 73.8 115 85.5C108.5 87 104 93 104 100C104 108.3 110.7 115 119 115H161C168.2 115 174 109.2 174 102C174 95.3 169 89.8 162.5 89.1C160.5 75.5 151.5 65 140 65Z" fill="#16120e" stroke="#F4D17A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Upload Arrow -->
    <path d="M140 106V85M140 85L131 94M140 85L149 94" stroke="#F4D17A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <defs>
    <filter id="glowFilter1" x="90" y="55" width="100" height="80" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F4D17A" flood-opacity="0.7"/>
    </filter>
  </defs>
</svg>
